<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Game of Life</title>
    <style>
        :root {
            --bg: #070c14;
            --panel: #0d1420;
            --line: #1c2a3d;
            --cell-alive: #4fa8ff;
            --cell-glow: #9cd4ff;
            --cell-newborn: #f2c14e;
            --amber: #f2c14e;
            --text: #d6e4f2;
            --text-dim: #63748c;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'Courier New', ui-monospace, Menlo, monospace;
            overflow: hidden;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        header {
            padding: 14px 20px 10px 20px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        .title {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 22px;
            letter-spacing: 0.5px;
            color: var(--cell-glow);
        }

        .title .dot {
            color: var(--amber);
        }

        .subtitle {
            font-size: 11px;
            color: var(--text-dim);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .stats {
            display: flex;
            gap: 18px;
            font-size: 12px;
            color: var(--text-dim);
        }

        .stats b {
            color: var(--cell-glow);
            font-weight: normal;
        }

        main {
            flex: 1;
            display: flex;
            min-height: 0;
        }

        #canvasWrap {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(ellipse at center, rgba(79, 168, 255, 0.05), transparent 70%),
                var(--bg);
            overflow: hidden;
        }

        canvas {
            background: #0a1120;
            box-shadow: 0 0 0 1px var(--line), 0 0 60px rgba(79, 168, 255, 0.08) inset;
            cursor: crosshair;
        }

        aside {
            width: 240px;
            border-left: 1px solid var(--line);
            background: var(--panel);
            padding: 18px 16px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            overflow-y: auto;
        }

        .section-label {
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 8px;
            display: block;
        }

        .btn-row {
            display: flex;
            gap: 8px;
        }

        button {
            font-family: inherit;
            font-size: 12px;
            letter-spacing: 0.5px;
            background: transparent;
            color: var(--text);
            border: 1px solid var(--line);
            padding: 9px 10px;
            cursor: pointer;
            transition: all 0.15s ease;
            flex: 1;
        }

        button:hover {
            border-color: var(--cell-alive);
            color: var(--cell-glow);
        }

        button:active {
            transform: translateY(1px);
        }

        button.primary {
            border-color: var(--cell-alive);
            color: var(--cell-alive);
        }

        button.primary.on {
            background: var(--cell-alive);
            color: #070c14;
            font-weight: bold;
        }

        button.wide {
            width: 100%;
        }

        button.amber {
            border-color: var(--amber);
            color: var(--amber);
        }

        .slider-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .slider-row .val {
            font-size: 11px;
            color: var(--cell-glow);
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            height: 2px;
            background: var(--line);
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--cell-alive);
            cursor: pointer;
            box-shadow: 0 0 8px var(--cell-alive);
        }

        select {
            width: 100%;
            font-family: inherit;
            font-size: 12px;
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--line);
            padding: 8px;
        }

        .divider {
            height: 1px;
            background: var(--line);
            margin: 2px 0;
        }

        .hint {
            font-size: 11px;
            color: var(--text-dim);
            line-height: 1.6;
        }

        .hint b {
            color: var(--text);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--line);
        }
    </style>
</head>

<body>
    <div id="app">
        <header>
            <div>
                <div class="title">Conway<span class="dot">.</span>Life</div>
                <div class="subtitle">a cellular automaton</div>
            </div>
            <div class="stats">
                <div>GEN <b id="genCount">0</b></div>
                <div>POP <b id="popCount">0</b></div>
                <div>RULE <b>B3/S23</b></div>
            </div>
        </header>
        <main>
            <div id="canvasWrap">
                <canvas id="grid" width="600" height="600"></canvas>
            </div>
            <aside>
                <div>
                    <span class="section-label">Run</span>
                    <div class="btn-row">
                        <button class="primary" id="playBtn">▶ Play</button>
                        <button id="stepBtn">Step</button>
                    </div>
                </div>

                <div class="slider-row">
                    <span class="section-label">Speed</span>
                    <input type="range" id="speedSlider" min="1" max="30" value="10">
                    <div class="val" id="speedVal">10 gen/s</div>
                </div>

                <div class="divider"></div>

                <div>
                    <span class="section-label">Board</span>
                    <div class="btn-row">
                        <button id="randomBtn" class="amber">Random</button>
                        <button id="clearBtn">Clear</button>
                    </div>
                </div>

                <div>
                    <span class="section-label">Pattern (click grid to place)</span>
                    <select id="patternSelect">
                        <option value="">— none, freehand draw —</option>
                        <option value="glider">Glider</option>
                        <option value="lwss">Lightweight Spaceship</option>
                        <option value="pulsar">Pulsar</option>
                        <option value="gun">Gosper Glider Gun</option>
                        <option value="pentomino">R-pentomino</option>
                    </select>
                </div>

                <div class="divider"></div>

                <div class="hint">
                    <b>Click</b> a cell to toggle it alive.<br>
                    Pick a pattern above, then <b>click</b> the grid to stamp it.<br>
                    Rules: a live cell survives with 2–3 neighbors; a dead cell is born with exactly 3.
                </div>
            </aside>
        </main>
    </div>

    <script>
        // =======================================================================
        // CONWAY'S GAME OF LIFE
        // The board is a grid of cells that are either ALIVE (1) or DEAD (0).
        // Every generation, we look at each cell's 8 neighbors and apply 4 rules:
        //   1. A live cell with fewer than 2 live neighbors dies  (underpopulation)
        //   2. A live cell with 2 or 3 live neighbors survives
        //   3. A live cell with more than 3 live neighbors dies    (overpopulation)
        //   4. A dead cell with exactly 3 live neighbors becomes alive (birth)
        // That's the entire simulation — everything below is just building the
        // grid, applying those 4 rules each tick, and drawing the result.
        // =======================================================================

        const numColumns = 70;
        const numRows = 70;

        const canvas = document.getElementById('grid');
        const ctx = canvas.getContext('2d');
        let cellSize; // how many pixels wide/tall each cell is drawn

        function resizeCanvas() {
            const wrap = document.getElementById('canvasWrap');
            const size = Math.min(wrap.clientWidth - 40, wrap.clientHeight - 40, 700);
            canvas.width = size;
            canvas.height = size;
            cellSize = size / numColumns;
            drawGrid();
        }

        // -----------------------------------------------------------------------
        // STATE
        // -----------------------------------------------------------------------
        // The board is stored as a 2D array: grid[row][column] is 0 (dead) or 1 (alive).
        let grid = createEmptyGrid();
        let isRunning = false;
        let generationCount = 0;
        let playTimer = null;        // holds the setInterval ID so we can stop it later
        let selectedPattern = "";    // which pattern (if any) is chosen in the dropdown

        // Build a fresh grid full of dead cells (all zeros).
        function createEmptyGrid() {
            const newGrid = [];
            for (let row = 0; row < numRows; row++) {
                newGrid.push(new Array(numColumns).fill(0));
            }
            return newGrid;
        }

        // Count how many cells on the whole board are currently alive (just for the UI counter).
        function countLivingCells(board) {
            let total = 0;
            for (let row = 0; row < numRows; row++) {
                for (let col = 0; col < numColumns; col++) {
                    if (board[row][col]) total++;
                }
            }
            return total;
        }

        // Count how many of a cell's 8 surrounding neighbors are alive.
        // We use "wraparound" so the edges of the board connect to the opposite
        // edge (like Pac-Man) instead of cells at the border having fewer neighbors.
        function countLiveNeighbors(board, row, col) {
            let liveNeighbors = 0;
            for (let rowOffset = -1; rowOffset <= 1; rowOffset++) {
                for (let colOffset = -1; colOffset <= 1; colOffset++) {
                    if (rowOffset === 0 && colOffset === 0) continue; // skip the cell itself
                    const neighborRow = (row + rowOffset + numRows) % numRows;
                    const neighborCol = (col + colOffset + numColumns) % numColumns;
                    liveNeighbors += board[neighborRow][neighborCol];
                }
            }
            return liveNeighbors;
        }

        // -----------------------------------------------------------------------
        // ADVANCE THE SIMULATION BY ONE GENERATION
        // -----------------------------------------------------------------------
        // Important: we build a brand new grid ("nextGrid") instead of editing
        // the current one in place. This matters because every cell's fate
        // depends on the CURRENT state of its neighbors — if we changed cells
        // one at a time, later cells would see already-updated neighbors and
        // the rules would break.
        function advanceOneGeneration() {
            const nextGrid = createEmptyGrid();
            const newlyBornGrid = createEmptyGrid(); // tracks which cells were just born, for a highlight effect

            for (let row = 0; row < numRows; row++) {
                for (let col = 0; col < numColumns; col++) {
                    const liveNeighbors = countLiveNeighbors(grid, row, col);
                    const isAlive = grid[row][col] === 1;

                    if (isAlive) {
                        // rule 1 + 2 + 3: survives only with 2 or 3 neighbors
                        nextGrid[row][col] = (liveNeighbors === 2 || liveNeighbors === 3) ? 1 : 0;
                    } else if (liveNeighbors === 3) {
                        // rule 4: a dead cell with exactly 3 neighbors is born
                        nextGrid[row][col] = 1;
                        newlyBornGrid[row][col] = 1;
                    }
                }
            }

            grid = nextGrid;
            generationCount++;
            document.getElementById('genCount').textContent = generationCount;
            document.getElementById('popCount').textContent = countLivingCells(grid);
            drawGrid(newlyBornGrid);
        }

        // -----------------------------------------------------------------------
        // DRAWING
        // -----------------------------------------------------------------------
        function drawGrid(newlyBornGrid) {
            ctx.fillStyle = '#0a1120';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // draw faint grid lines
            ctx.strokeStyle = 'rgba(28,42,61,0.6)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let col = 0; col <= numColumns; col++) {
                ctx.moveTo(col * cellSize, 0);
                ctx.lineTo(col * cellSize, canvas.height);
            }
            for (let row = 0; row <= numRows; row++) {
                ctx.moveTo(0, row * cellSize);
                ctx.lineTo(canvas.width, row * cellSize);
            }
            ctx.stroke();

            // draw every living cell
            for (let row = 0; row < numRows; row++) {
                for (let col = 0; col < numColumns; col++) {
                    if (grid[row][col]) {
                        const isNewlyBorn = newlyBornGrid && newlyBornGrid[row][col];
                        ctx.fillStyle = isNewlyBorn ? '#f2c14e' : '#4fa8ff';
                        ctx.shadowColor = isNewlyBorn ? '#f2c14e' : '#4fa8ff';
                        ctx.shadowBlur = isNewlyBorn ? 10 : 6;
                        ctx.fillRect(col * cellSize + 1, row * cellSize + 1, cellSize - 2, cellSize - 2);
                    }
                }
            }
            ctx.shadowBlur = 0;
            document.getElementById('popCount').textContent = countLivingCells(grid);
        }

        // -----------------------------------------------------------------------
        // STARTING PATTERNS
        // -----------------------------------------------------------------------
        // Each pattern is just a list of [row, column] offsets describing which
        // cells should be turned on, relative to wherever the user clicks.
        // These are well-known Game of Life shapes, not something you'd need
        // to invent yourself — see conwaylife.com for a big library of them.
        const knownPatterns = {
            glider: [[0, 1], [1, 2], [2, 0], [2, 1], [2, 2]],
            lwss: [[0, 1], [0, 4], [1, 0], [2, 0], [2, 4], [3, 0], [3, 1], [3, 2], [3, 3]],
            pulsar: [
                [0, 2], [0, 3], [0, 4], [0, 8], [0, 9], [0, 10],
                [2, 0], [2, 5], [2, 7], [2, 12],
                [3, 0], [3, 5], [3, 7], [3, 12],
                [4, 0], [4, 5], [4, 7], [4, 12],
                [5, 2], [5, 3], [5, 4], [5, 8], [5, 9], [5, 10],
                [7, 2], [7, 3], [7, 4], [7, 8], [7, 9], [7, 10],
                [8, 0], [8, 5], [8, 7], [8, 12],
                [9, 0], [9, 5], [9, 7], [9, 12],
                [10, 0], [10, 5], [10, 7], [10, 12],
                [12, 2], [12, 3], [12, 4], [12, 8], [12, 9], [12, 10]
            ],
            gun: [
                [0, 24],
                [1, 22], [1, 24],
                [2, 12], [2, 13], [2, 20], [2, 21], [2, 34], [2, 35],
                [3, 11], [3, 15], [3, 20], [3, 21], [3, 34], [3, 35],
                [4, 0], [4, 1], [4, 10], [4, 16], [4, 20], [4, 21],
                [5, 0], [5, 1], [5, 10], [5, 14], [5, 16], [5, 17], [5, 22], [5, 24],
                [6, 10], [6, 16], [6, 24],
                [7, 11], [7, 15],
                [8, 12], [8, 13]
            ],
            pentomino: [[0, 1], [0, 2], [1, 0], [1, 1], [2, 1]]
        };

        // Turn on all the cells for a given pattern, starting at (originRow, originCol).
        function stampPattern(patternName, originRow, originCol) {
            const offsets = knownPatterns[patternName];
            if (!offsets) return;
            for (const [rowOffset, colOffset] of offsets) {
                const row = (originRow + rowOffset) % numRows;
                const col = (originCol + colOffset) % numColumns;
                grid[row][col] = 1;
            }
            drawGrid();
        }

        // -----------------------------------------------------------------------
        // MOUSE INTERACTION (click or drag to draw cells)
        // -----------------------------------------------------------------------
        let isMouseDown = false;

        canvas.addEventListener('mousedown', (event) => {
            isMouseDown = true;
            handleCanvasClick(event, false);
        });
        window.addEventListener('mouseup', () => { isMouseDown = false; });
        canvas.addEventListener('mousemove', (event) => {
            if (isMouseDown && !selectedPattern) handleCanvasClick(event, true);
        });

        function handleCanvasClick(event, isDragging) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = event.clientX - rect.left;
            const mouseY = event.clientY - rect.top;
            const col = Math.floor(mouseX / cellSize);
            const row = Math.floor(mouseY / cellSize);
            if (row < 0 || row >= numRows || col < 0 || col >= numColumns) return;

            if (selectedPattern) {
                stampPattern(selectedPattern, row, col);
                return;
            }

            if (isDragging) {
                grid[row][col] = 1; // dragging always paints alive cells
            } else {
                grid[row][col] = grid[row][col] ? 0 : 1; // a single click toggles the cell
            }
            drawGrid();
        }

        // -----------------------------------------------------------------------
        // BUTTONS AND CONTROLS
        // -----------------------------------------------------------------------
        const playBtn = document.getElementById('playBtn');
        const stepBtn = document.getElementById('stepBtn');
        const speedSlider = document.getElementById('speedSlider');
        const speedVal = document.getElementById('speedVal');
        const randomBtn = document.getElementById('randomBtn');
        const clearBtn = document.getElementById('clearBtn');
        const patternSelect = document.getElementById('patternSelect');

        function setRunning(shouldRun) {
            isRunning = shouldRun;
            if (isRunning) {
                playBtn.textContent = '❚❚ Pause';
                playBtn.classList.add('on');
                startAutoPlay();
            } else {
                playBtn.textContent = '▶ Play';
                playBtn.classList.remove('on');
                clearInterval(playTimer);
            }
        }

        // Repeatedly call advanceOneGeneration() at the speed set by the slider.
        function startAutoPlay() {
            clearInterval(playTimer);
            const generationsPerSecond = parseInt(speedSlider.value, 10);
            playTimer = setInterval(advanceOneGeneration, 1000 / generationsPerSecond);
        }

        playBtn.addEventListener('click', () => setRunning(!isRunning));
        stepBtn.addEventListener('click', () => { if (!isRunning) advanceOneGeneration(); });

        speedSlider.addEventListener('input', () => {
            speedVal.textContent = speedSlider.value + ' gen/s';
            if (isRunning) startAutoPlay();
        });

        randomBtn.addEventListener('click', () => {
            grid = createEmptyGrid();
            for (let row = 0; row < numRows; row++) {
                for (let col = 0; col < numColumns; col++) {
                    grid[row][col] = Math.random() < 0.22 ? 1 : 0;
                }
            }
            generationCount = 0;
            document.getElementById('genCount').textContent = generationCount;
            drawGrid();
        });

        clearBtn.addEventListener('click', () => {
            grid = createEmptyGrid();
            generationCount = 0;
            document.getElementById('genCount').textContent = generationCount;
            setRunning(false);
            drawGrid();
        });

        patternSelect.addEventListener('change', () => {
            selectedPattern = patternSelect.value;
        });

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // seed the board with a glider so there's something to see right away
        stampPattern('glider', 5, 5);
    </script>
</body>

</html>
