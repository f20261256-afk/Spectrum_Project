<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Double Pendulum</title>
    <style>
        body {
            background: #0a1120;
            color: #d6e4f2;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas {
            background: #0a1120;
            border: 1px solid #1c2a3d;
        }

        button {
            font-family: monospace;
            background: #0d1420;
            color: #d6e4f2;
            border: 1px solid #1c2a3d;
            padding: 8px 14px;
            margin: 4px;
            cursor: pointer;
        }

        button:hover {
            border-color: #4fa8ff;
            color: #9cd4ff;
        }
    </style>
</head>

<body>

    <h1>Double Pendulum</h1>
    <canvas id="pend" width="600" height="600"></canvas>

    <div style="margin-top: 12px;">
        <button id="playBtn">Play</button>
        <button id="resetBtn">Reset</button>
        <button id="randomBtn">Random</button>
    </div>

    <script>
        const canvas = document.getElementById('pend');
        const ctx = canvas.getContext('2d');

        const pivotX = canvas.width / 2;
        const pivotY = canvas.height * 0.25;
        const pixelsPerMeter = 150; // how many pixels represent 1 meter of arm length

        // physics settings
        const gravity = 9.81;
        const mass1 = 1;
        const mass2 = 1;
        const armLength1 = 1;
        const armLength2 = 1;
        const timeStep = 0.02; // seconds simulated per step

        // current state (starting angles, in radians)
        let angle1 = Math.PI * 0.7; // about 126 degrees
        let angle2 = Math.PI * 0.9; // about 162 degrees
        let speed1 = 0; // angular speed of top arm
        let speed2 = 0; // angular speed of bottom arm

        let trail = []; // stores past positions of the bottom bob, for the fading line

        function calculateAccelerations() {
            const diff = angle1 - angle2;

            const den1 = armLength1 * (2 * mass1 + mass2 - mass2 * Math.cos(2 * diff));
            const den2 = armLength2 * (2 * mass1 + mass2 - mass2 * Math.cos(2 * diff));

            const num1 = -gravity * (2 * mass1 + mass2) * Math.sin(angle1)
                - mass2 * gravity * Math.sin(angle1 - 2 * angle2)
                - 2 * Math.sin(diff) * mass2 * (speed2 * speed2 * armLength2 + speed1 * speed1 * armLength1 * Math.cos(diff));
            const accel1 = num1 / den1;

            const num2 = 2 * Math.sin(diff) * (
                speed1 * speed1 * armLength1 * (mass1 + mass2)
                + gravity * (mass1 + mass2) * Math.cos(angle1)
                + speed2 * speed2 * armLength2 * mass2 * Math.cos(diff)
            );
            const accel2 = num2 / den2;

            return [accel1, accel2];
        }

        function stepSimulation() {
            const [accel1, accel2] = calculateAccelerations();

            speed1 += accel1 * timeStep;
            speed2 += accel2 * timeStep;

            angle1 += speed1 * timeStep;
            angle2 += speed2 * timeStep;
        }

        function getBobPositions() {
            const x1 = pivotX + armLength1 * pixelsPerMeter * Math.sin(angle1);
            const y1 = pivotY + armLength1 * pixelsPerMeter * Math.cos(angle1);
            const x2 = x1 + armLength2 * pixelsPerMeter * Math.sin(angle2);
            const y2 = y1 + armLength2 * pixelsPerMeter * Math.cos(angle2);
            return { x1, y1, x2, y2 };
        }

        function drawFrame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const { x1, y1, x2, y2 } = getBobPositions();

            // draw the fading trail
            ctx.beginPath();
            for (let i = 0; i < trail.length; i++) {
                const point = trail[i];
                if (i === 0) ctx.moveTo(point.x, point.y);
                else ctx.lineTo(point.x, point.y);
            }
            ctx.strokeStyle = "#ff6ec7";
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // draw the arms
            ctx.strokeStyle = "#3a4a63";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(pivotX, pivotY);
            ctx.lineTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();

            // draw bob 1
            ctx.fillStyle = "#4fa8ff";
            ctx.beginPath();
            ctx.arc(x1, y1, 12, 0, Math.PI * 2);
            ctx.fill();

            // draw bob 2
            ctx.fillStyle = "#ff6ec7";
            ctx.beginPath();
            ctx.arc(x2, y2, 12, 0, Math.PI * 2);
            ctx.fill();
        }

        let isPlaying = false;
        let playInterval = null;

        const playBtn = document.getElementById('playBtn');
        const resetBtn = document.getElementById('resetBtn');
        const randomBtn = document.getElementById('randomBtn');

        playBtn.addEventListener('click', function () {
            isPlaying = !isPlaying;

            if (isPlaying) {
                playBtn.textContent = "Pause";
                playInterval = setInterval(function () {
                    stepSimulation();
                    const { x2, y2 } = getBobPositions();
                    trail.push({ x: x2, y: y2 });
                    if (trail.length > 500) trail.shift(); // keep the trail from growing forever
                    drawFrame();
                }, 20);
            } else {
                playBtn.textContent = "Play";
                clearInterval(playInterval);
            }
        });

        resetBtn.addEventListener('click', function () {
            isPlaying = false;
            playBtn.textContent = "Play";
            clearInterval(playInterval);

            angle1 = Math.PI * 0.7;
            angle2 = Math.PI * 0.9;
            speed1 = 0;
            speed2 = 0;
            trail = [];
            drawFrame();
        });

        randomBtn.addEventListener('click', function () {
            isPlaying = false;
            playBtn.textContent = "Play";
            clearInterval(playInterval);

            angle1 = Math.random() * Math.PI * 2; // random angle, 0 to 360 degrees
            angle2 = Math.random() * Math.PI * 2;
            speed1 = 0;
            speed2 = 0;
            trail = [];
            drawFrame();
        });

        drawFrame(); // draw the starting position before Play is clicked
    </script>

</body>

</html>
