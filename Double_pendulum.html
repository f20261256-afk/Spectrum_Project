<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Double Pendulum</title>
    <style>
        :root {
            --bg: #070c14;
            --panel: #0d1420;
            --line: #1c2a3d;
            --bob1: #4fa8ff;
            --bob2: #ff6ec7;
            --glow: #9cd4ff;
            --amber: #f2c14e;
            --text: #d6e4f2;
            --text-dim: #63748c;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'Courier New', ui-monospace, Menlo, monospace;
            overflow: hidden;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        header {
            padding: 14px 20px 10px 20px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        .title {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 22px;
            letter-spacing: 0.5px;
            color: var(--glow);
        }

        .title .dot {
            color: var(--amber);
        }

        .subtitle {
            font-size: 11px;
            color: var(--text-dim);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .stats {
            display: flex;
            gap: 18px;
            font-size: 12px;
            color: var(--text-dim);
        }

        .stats b {
            color: var(--glow);
            font-weight: normal;
        }

        main {
            flex: 1;
            display: flex;
            min-height: 0;
        }

        #canvasWrap {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at center, rgba(79, 168, 255, 0.05), transparent 70%), var(--bg);
            overflow: hidden;
        }

        canvas {
            background: #0a1120;
            box-shadow: 0 0 0 1px var(--line), 0 0 60px rgba(79, 168, 255, 0.08) inset;
        }

        canvas.draggable {
            cursor: grab;
        }

        canvas.dragging {
            cursor: grabbing;
        }

        aside {
            width: 250px;
            border-left: 1px solid var(--line);
            background: var(--panel);
            padding: 18px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
        }

        .section-label {
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 8px;
            display: block;
        }

        .btn-row {
            display: flex;
            gap: 8px;
        }

        button {
            font-family: inherit;
            font-size: 12px;
            letter-spacing: 0.5px;
            background: transparent;
            color: var(--text);
            border: 1px solid var(--line);
            padding: 9px 10px;
            cursor: pointer;
            transition: all 0.15s ease;
            flex: 1;
        }

        button:hover {
            border-color: var(--bob1);
            color: var(--glow);
        }

        button:active {
            transform: translateY(1px);
        }

        button.primary {
            border-color: var(--bob1);
            color: var(--bob1);
        }

        button.primary.on {
            background: var(--bob1);
            color: #070c14;
            font-weight: bold;
        }

        button.amber {
            border-color: var(--amber);
            color: var(--amber);
        }

        .slider-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .slider-row .val {
            font-size: 11px;
            color: var(--glow);
        }

        .slider-row label {
            font-size: 11px;
            color: var(--text-dim);
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            height: 2px;
            background: var(--line);
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--bob1);
            cursor: pointer;
            box-shadow: 0 0 8px var(--bob1);
        }

        .divider {
            height: 1px;
            background: var(--line);
            margin: 2px 0;
        }

        .hint {
            font-size: 11px;
            color: var(--text-dim);
            line-height: 1.6;
        }

        .hint b {
            color: var(--text);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--line);
        }

        label.check {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: var(--text-dim);
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="app">
        <header>
            <div>
                <div class="title">Double<span class="dot">.</span>Pendulum</div>
                <div class="subtitle">chaos from two swinging arms</div>
            </div>
            <div class="stats">
                <div>TIME <b id="timeCount">0.0s</b></div>
            </div>
        </header>
        <main>
            <div id="canvasWrap">
                <canvas id="pend" width="600" height="600"></canvas>
            </div>
            <aside>
                <div>
                    <span class="section-label">Run</span>
                    <div class="btn-row">
                        <button class="primary" id="playBtn">▶ Play</button>
                        <button id="resetBtn">Reset</button>
                    </div>
                </div>

                <div class="slider-row">
                    <span class="section-label">Sim Speed</span>
                    <input type="range" id="speedSlider" min="1" max="5" step="1" value="2">
                    <div class="val" id="speedVal">2x</div>
                </div>

                <div class="divider"></div>

                <div>
                    <span class="section-label">Starting Angles</span>
                    <div class="slider-row">
                        <label>Top arm angle</label>
                        <input type="range" id="angle1Slider" min="-180" max="180" step="1" value="120">
                        <div class="val" id="angle1Val">120°</div>
                    </div>
                    <div class="slider-row">
                        <label>Bottom arm angle</label>
                        <input type="range" id="angle2Slider" min="-180" max="180" step="1" value="-10">
                        <div class="val" id="angle2Val">-10°</div>
                    </div>
                </div>

                <div class="divider"></div>

                <div>
                    <span class="section-label">Trail</span>
                    <label class="check"><input type="checkbox" id="trailToggle" checked> show path of tip</label>
                    <div class="btn-row" style="margin-top:8px;">
                        <button id="clearTrailBtn">Clear Trail</button>
                        <button id="randomBtn" class="amber">Random</button>
                    </div>
                </div>

                <div class="divider"></div>

                <div class="hint">
                    Pause first, then <b>drag either bob</b> to set a new starting angle.<br>
                    Small changes to the top angle lead to wildly different paths after a few seconds — that's chaos in
                    action.
                </div>
            </aside>
        </main>
    </div>

    <script>
        // =======================================================================
        // DOUBLE PENDULUM SIMULATION
        // A double pendulum is one pendulum arm hanging off the end of another.
        // We track just two numbers to describe its whole shape:
        //   angle1 = angle of the TOP arm, measured from straight down
        //   angle2 = angle of the BOTTOM arm, measured from straight down
        // Everything else (where the two balls/"bobs" are drawn) is calculated
        // from those two angles using basic trigonometry (sin/cos).
        // =======================================================================

        // ---- grab the canvas we will draw on ----
        const canvas = document.getElementById('pend');
        const ctx = canvas.getContext('2d');
        const wrap = document.getElementById('canvasWrap');

        // these get set in resizeCanvas() below
        let canvasSize;      // width/height of the square canvas, in pixels
        let pivotX, pivotY;  // pixel position of the fixed point the pendulum hangs from
        let pixelsPerMeter;  // how many pixels represent 1 meter of arm length

        function resizeCanvas() {
            const size = Math.min(wrap.clientWidth - 40, wrap.clientHeight - 40, 700);
            canvas.width = size;
            canvas.height = size;
            canvasSize = size;
            pivotX = size / 2;
            pivotY = size * 0.28;
            pixelsPerMeter = size / 4.2;
        }

        // -----------------------------------------------------------------------
        // PHYSICS SETTINGS (things you could tweak)
        // -----------------------------------------------------------------------
        const GRAVITY = 9.81;   // gravity, meters per second squared (real-world value)
        const mass1 = 1.0;      // weight of the top bob
        const mass2 = 1.0;      // weight of the bottom bob
        const armLength1 = 1.0; // length of the top arm, in meters
        const armLength2 = 1.0; // length of the bottom arm, in meters
        const timeStep = 0.005; // how many seconds we advance the simulation each tiny step

        // -----------------------------------------------------------------------
        // SIMULATION STATE (things that change while it's running)
        // -----------------------------------------------------------------------
        let angle1, angle2;         // current angles of each arm, in radians
        let angularSpeed1, angularSpeed2; // how fast each angle is currently changing
        let running = false;        // is the simulation currently playing?
        let simTime = 0;            // total seconds simulated so far
        let trailPoints = [];       // list of past positions of the bottom bob, for drawing the trail
        let simSpeed = 2;           // how many physics steps to run per animation frame

        function degreesToRadians(deg) { return deg * Math.PI / 180; }
        function radiansToDegrees(rad) { return rad * 180 / Math.PI; }

        // Reset the simulation back to whatever angles the sliders say
        function resetSimulation() {
            angle1 = degreesToRadians(parseFloat(document.getElementById('angle1Slider').value));
            angle2 = degreesToRadians(parseFloat(document.getElementById('angle2Slider').value));
            angularSpeed1 = 0;
            angularSpeed2 = 0;
            simTime = 0;
            trailPoints = [];
            document.getElementById('timeCount').textContent = '0.0s';
            drawEverything();
        }

        // -----------------------------------------------------------------------
        // THE PHYSICS FORMULA
        // -----------------------------------------------------------------------
        // This is the hard part, and it's not something you'd be expected to
        // derive yourself — it comes from a branch of physics called Lagrangian
        // mechanics. These formulas are the *standard, published* equations for
        // exactly this system (you can find the same formula on Wikipedia's
        // "Double pendulum" page). What they tell us: given the CURRENT angles
        // and CURRENT angular speeds of both arms, how fast is each arm
        // currently accelerating (speeding up or slowing down)?
        //
        // We only need to know this "instant snapshot" of acceleration, because
        // we're going to use it to nudge the simulation forward in very tiny
        // time steps (see stepSimulation() below).
        // -----------------------------------------------------------------------
        function calculateAccelerations(th1, th2, w1, w2) {
            const angleDifference = th1 - th2;

            // shared denominator terms (just part of the formula, not meaningful on their own)
            const denominator1 = armLength1 * (2 * mass1 + mass2 - mass2 * Math.cos(2 * angleDifference));
            const denominator2 = armLength2 * (2 * mass1 + mass2 - mass2 * Math.cos(2 * angleDifference));

            // acceleration of the top arm
            const numerator1 =
                -GRAVITY * (2 * mass1 + mass2) * Math.sin(th1)
                - mass2 * GRAVITY * Math.sin(th1 - 2 * th2)
                - 2 * Math.sin(angleDifference) * mass2 *
                (w2 * w2 * armLength2 + w1 * w1 * armLength1 * Math.cos(angleDifference));
            const accel1 = numerator1 / denominator1;

            // acceleration of the bottom arm
            const numerator2 = 2 * Math.sin(angleDifference) * (
                w1 * w1 * armLength1 * (mass1 + mass2)
                + GRAVITY * (mass1 + mass2) * Math.cos(th1)
                + w2 * w2 * armLength2 * mass2 * Math.cos(angleDifference)
            );
            const accel2 = numerator2 / denominator2;

            return [accel1, accel2];
        }

        // -----------------------------------------------------------------------
        // ADVANCING THE SIMULATION ONE TINY STEP FORWARD
        // -----------------------------------------------------------------------
        // There's no simple formula for "where will the pendulum be in 5 seconds" —
        // the motion is too tangled up for that. Instead, we simulate time in
        // tiny slices (timeStep = 0.005 seconds each):
        //   1. Work out the current acceleration of each arm (calculateAccelerations)
        //   2. Use that acceleration to update the angular speeds
        //   3. Use the (now updated) speeds to update the angles themselves
        // This approach is called "semi-implicit Euler integration" — it's the
        // simplest way to numerically simulate motion, and easy to follow step
        // by step, even though fancier methods (like Runge-Kutta) are more
        // accurate over long simulations.
        // -----------------------------------------------------------------------
        function stepSimulation() {
            const [accel1, accel2] = calculateAccelerations(angle1, angle2, angularSpeed1, angularSpeed2);

            // update speeds using acceleration
            angularSpeed1 += accel1 * timeStep;
            angularSpeed2 += accel2 * timeStep;

            // update angles using the (new) speeds
            angle1 += angularSpeed1 * timeStep;
            angle2 += angularSpeed2 * timeStep;

            simTime += timeStep;
        }

        // -----------------------------------------------------------------------
        // DRAWING
        // -----------------------------------------------------------------------

        // Turn the two angles into actual pixel positions on screen using
        // basic trigonometry: if an arm has length L and angle theta from
        // vertical, its tip is at (L*sin(theta), L*cos(theta)) relative to
        // wherever it's hanging from.
        function getBobPositions() {
            const x1 = pivotX + armLength1 * pixelsPerMeter * Math.sin(angle1);
            const y1 = pivotY + armLength1 * pixelsPerMeter * Math.cos(angle1);
            const x2 = x1 + armLength2 * pixelsPerMeter * Math.sin(angle2);
            const y2 = y1 + armLength2 * pixelsPerMeter * Math.cos(angle2);
            return { x1, y1, x2, y2 };
        }

        function drawEverything() {
            // clear the canvas
            ctx.fillStyle = '#0a1120';
            ctx.fillRect(0, 0, canvasSize, canvasSize);

            // small crosshair marking the fixed pivot point
            ctx.strokeStyle = 'rgba(28,42,61,0.6)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(pivotX - 10, pivotY); ctx.lineTo(pivotX + 10, pivotY);
            ctx.moveTo(pivotX, pivotY - 10); ctx.lineTo(pivotX, pivotY + 10);
            ctx.stroke();

            const { x1, y1, x2, y2 } = getBobPositions();

            // draw the fading trail of the bottom bob's path
            if (document.getElementById('trailToggle').checked && trailPoints.length > 1) {
                ctx.beginPath();
                for (let i = 0; i < trailPoints.length; i++) {
                    const point = trailPoints[i];
                    if (i === 0) ctx.moveTo(point.x, point.y);
                    else ctx.lineTo(point.x, point.y);
                }
                ctx.strokeStyle = 'rgba(255,110,199,0.5)';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }

            // draw the two rigid arms as straight lines
            ctx.strokeStyle = '#3a4a63';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(pivotX, pivotY);
            ctx.lineTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();

            // draw the pivot point
            ctx.fillStyle = '#63748c';
            ctx.beginPath();
            ctx.arc(pivotX, pivotY, 4, 0, Math.PI * 2);
            ctx.fill();

            // draw bob 1 (top ball)
            ctx.fillStyle = '#4fa8ff';
            ctx.shadowColor = '#4fa8ff';
            ctx.shadowBlur = 14;
            ctx.beginPath();
            ctx.arc(x1, y1, 13, 0, Math.PI * 2);
            ctx.fill();

            // draw bob 2 (bottom ball)
            ctx.fillStyle = '#ff6ec7';
            ctx.shadowColor = '#ff6ec7';
            ctx.shadowBlur = 14;
            ctx.beginPath();
            ctx.arc(x2, y2, 13, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            document.getElementById('timeCount').textContent = simTime.toFixed(1) + 's';
        }

        // This runs once per animation frame while the sim is playing.
        function animationLoop() {
            if (!running) return;

            // run several tiny physics steps per visible frame (controlled by simSpeed)
            for (let i = 0; i < simSpeed; i++) {
                stepSimulation();
                const { x2, y2 } = getBobPositions();
                trailPoints.push({ x: x2, y: y2 });
                if (trailPoints.length > 1500) trailPoints.shift(); // keep the trail from growing forever
            }

            drawEverything();
            requestAnimationFrame(animationLoop);
        }

        // -----------------------------------------------------------------------
        // BUTTONS AND SLIDERS
        // -----------------------------------------------------------------------
        const playBtn = document.getElementById('playBtn');
        const resetBtn = document.getElementById('resetBtn');
        const speedSlider = document.getElementById('speedSlider');
        const speedVal = document.getElementById('speedVal');
        const angle1Slider = document.getElementById('angle1Slider');
        const angle2Slider = document.getElementById('angle2Slider');
        const angle1Val = document.getElementById('angle1Val');
        const angle2Val = document.getElementById('angle2Val');
        const clearTrailBtn = document.getElementById('clearTrailBtn');
        const randomBtn = document.getElementById('randomBtn');

        function setRunning(shouldRun) {
            running = shouldRun;
            playBtn.textContent = running ? '❚❚ Pause' : '▶ Play';
            playBtn.classList.toggle('on', running);
            canvas.classList.toggle('draggable', !running);
            if (running) requestAnimationFrame(animationLoop);
        }

        playBtn.addEventListener('click', () => setRunning(!running));
        resetBtn.addEventListener('click', () => { setRunning(false); resetSimulation(); });

        speedSlider.addEventListener('input', () => {
            simSpeed = parseInt(speedSlider.value, 10);
            speedVal.textContent = simSpeed + 'x';
        });

        angle1Slider.addEventListener('input', () => {
            angle1Val.textContent = angle1Slider.value + '°';
            if (!running) resetSimulation();
        });
        angle2Slider.addEventListener('input', () => {
            angle2Val.textContent = angle2Slider.value + '°';
            if (!running) resetSimulation();
        });

        clearTrailBtn.addEventListener('click', () => { trailPoints = []; drawEverything(); });

        randomBtn.addEventListener('click', () => {
            const randomAngle1 = Math.floor(Math.random() * 360 - 180);
            const randomAngle2 = Math.floor(Math.random() * 360 - 180);
            angle1Slider.value = randomAngle1;
            angle2Slider.value = randomAngle2;
            angle1Val.textContent = randomAngle1 + '°';
            angle2Val.textContent = randomAngle2 + '°';
            setRunning(false);
            resetSimulation();
        });

        // -----------------------------------------------------------------------
        // DRAG-TO-SET-ANGLE (only works while paused)
        // -----------------------------------------------------------------------
        let draggingBob = null; // will be 'top' or 'bottom' while the user is dragging

        canvas.addEventListener('mousedown', (event) => {
            if (running) return; // don't allow dragging while it's playing

            const rect = canvas.getBoundingClientRect();
            const mouseX = event.clientX - rect.left;
            const mouseY = event.clientY - rect.top;

            const { x1, y1, x2, y2 } = getBobPositions();
            const distanceToTopBob = Math.hypot(mouseX - x1, mouseY - y1);
            const distanceToBottomBob = Math.hypot(mouseX - x2, mouseY - y2);

            // only start dragging if the click was reasonably close to a bob
            if (distanceToTopBob < 25 || distanceToBottomBob < 25) {
                draggingBob = (distanceToBottomBob < distanceToTopBob) ? 'bottom' : 'top';
                canvas.classList.add('dragging');
            }
        });

        window.addEventListener('mousemove', (event) => {
            if (!draggingBob) return;

            const rect = canvas.getBoundingClientRect();
            const mouseX = event.clientX - rect.left;
            const mouseY = event.clientY - rect.top;

            if (draggingBob === 'top') {
                // angle from the pivot point to the mouse
                const dx = mouseX - pivotX;
                const dy = mouseY - pivotY;
                angle1 = Math.atan2(dx, dy);
                angle1Slider.value = Math.round(radiansToDegrees(angle1));
                angle1Val.textContent = angle1Slider.value + '°';
            } else {
                // angle from the TOP bob (not the pivot) to the mouse
                const { x1, y1 } = getBobPositions();
                const dx = mouseX - x1;
                const dy = mouseY - y1;
                angle2 = Math.atan2(dx, dy);
                angle2Slider.value = Math.round(radiansToDegrees(angle2));
                angle2Val.textContent = angle2Slider.value + '°';
            }

            // dragging resets speed and trail so it doesn't look broken
            angularSpeed1 = 0;
            angularSpeed2 = 0;
            trailPoints = [];
            drawEverything();
        });

        window.addEventListener('mouseup', () => {
            draggingBob = null;
            canvas.classList.remove('dragging');
        });

        window.addEventListener('resize', () => { resizeCanvas(); drawEverything(); });

        // ---- start everything up ----
        resizeCanvas();
        canvas.classList.add('draggable');
        resetSimulation();
    </script>
</body>

</html>
